<!doctype html>
<!-- (: SMILE (PROMPT SYSTEM) SYNTAX :) -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smile Window Host</title>
<link rel="stylesheet" href="/vendor/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="/styles/tokens.css"><link rel="stylesheet" href="/styles/win98.css"><link rel="stylesheet" href="/styles/aero.css"><link rel="stylesheet" href="/styles/sky.css">
<style>
/* The Smile Client's Windows 48 look, Frutiger Aero glass on a night-to-sunset sky, from the Client's own style files. */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow:hidden;font:13px/1.45 var(--font-ui);color:var(--ink)}
.sky::before{position:fixed}
#desk{position:absolute;inset:0 0 44px 0}
#bar{position:fixed;bottom:0;left:0;right:0;height:44px;z-index:9999;align-items:center}
#bar .w98-start{white-space:nowrap}
#bar label{display:flex;gap:4px;align-items:center;font-size:12px;white-space:nowrap}
#status{margin-left:auto;white-space:nowrap}
.win{position:absolute;display:flex;flex-direction:column;min-width:320px;min-height:180px;resize:both;overflow:hidden;padding:2px}
.win.focus{box-shadow:4px 4px 0 rgba(0,0,0,.25),0 0 0 2px var(--aqua-b),0 0 24px rgba(111,211,255,.55)}
.win:not(.focus) .tt{filter:saturate(.35) brightness(1.15)}
.tt{cursor:move;user-select:none}
.tt span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.tt button{position:relative;z-index:1;padding:1px 8px;font-size:12px}
.tt input{position:relative;z-index:1}
.body{flex:1;margin-top:2px;background:#07071a}
#swarm{position:absolute;right:14px;top:14px;bottom:58px;width:360px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:0 0 12px;z-index:9000}
#swarm .w98-titlebar{border-radius:10px 10px 0 0}
#swarm .inner{display:flex;flex-direction:column;gap:6px;padding:0 12px}
#swarm label{font-size:11px;font-weight:700;color:var(--ink-title);margin-top:2px}
#swarm label:has(input){font-weight:400;color:var(--ink);display:flex;gap:6px;align-items:center}
#swarm textarea{min-height:46px;resize:vertical}
#ledger{flex:1;min-height:90px;overflow:auto;font:11px/1.4 var(--font-code);white-space:pre-wrap;background:#fff;padding:6px}
#viaPrompter,#send{width:100%}
#panelBtn{display:none}
@media (max-width:760px){
 #desk{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
 .win{position:relative!important;left:0!important;top:0!important;width:100%!important;height:55vh!important;resize:none;flex:none}
 .tt button{padding:6px 12px}
 #swarm{position:fixed;left:0;right:0;top:auto;bottom:44px;width:auto;max-height:78vh;border-radius:14px 14px 0 0;display:none}
 #swarm.open{display:flex}
 #panelBtn{display:inline-block;order:-1}
 #bar{overflow-x:auto;scrollbar-width:none} #bar>*{flex:none} #bar button{white-space:nowrap} #status{display:none}
 #custom{width:130px!important}
}
</style></head><body class="sky w98-fields">
<div id="desk"></div>
<div id="swarm" class="aero-glass">
  <div class="w98-titlebar"><img src="/assets/icon.svg" alt=""><b>Prompt to Sangha</b></div>
  <div class="inner">
  <label>Network communication structure</label>
  <select id="net"><option>star, every window reports to the Ganapati window</option><option>ring, each window passes to the next</option><option>mesh, every window may message every window</option><option>chain of command, user then Cosmic Spider then Ganapati then Ganas</option></select>
  <label>Writing style</label><textarea id="style">Precise, kind, no colons, no metaphors for technical processes, every prompt in Smile.</textarea>
  <label>Roles (window number = role)</label><textarea id="roles">1 = Ganapati, coordinates
2 = Gana, builder
3 = Gana, tester</textarea>
  <label>Tools available</label><textarea id="tools">shell, file edits, git, playwright</textarea>
  <label>Sworn values</label><textarea id="values">Benefit all beings. Follow the user first. Report every failure directly.</textarea>
  <label>Instruction</label><textarea id="msg" placeholder="What the Sangha does next"></textarea>
  <label><input type="checkbox" id="judge" checked> a model checks each reply against the sworn values</label>
  <label><input type="checkbox" id="shot" checked> attach a screenshot of the interface each prompt</label>
  <button class="aero-button" id="viaPrompter">Send to the Prompter, it prompts the ticked windows (all if none)</button>
  <button class="w98-button" id="send">Send directly to selected windows (all if none ticked)</button>
  <div id="ledger" class="w98-sunken"></div>
  </div>
</div>
<div id="bar" class="w98-taskbar">
  <span class="w98-start brand"><img src="/assets/icon.svg" alt=""><i>Windows</i> 48</span>
  <button class="aero-button" data-cmd="claude" data-role="prompter">+ Prompter (Claude Code)</button>
  <button class="w98-button" data-cmd="claude">+ Claude Code</button>
  <button class="w98-button" data-cmd="bash">+ Shell</button>
  <label style="font-size:11px"><input type="checkbox" id="keep"> restart when it ends</label>
  <input id="custom" placeholder="any command line program" style="width:260px">
  <button class="w98-button" id="launch">Open as window</button>
  <button class="aero-button" id="panelBtn">Sangha</button><span class="w98-tray" id="status" style="margin-left:auto;color:#999"></span>
</div>
<script src="/vendor/@xterm/xterm/lib/xterm.js"></script>
<script src="/vendor/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="/vendor/html2canvas/dist/html2canvas.min.js"></script>
<script>
const $ = s => document.querySelector(s), wins = {};
let z = 10, n = 0;
async function api(p, b) { const r = await fetch(p, b ? { method: 'POST', body: JSON.stringify(b) } : {}); return p === '/api/ledger' ? r.text() : r.json(); }

function openWindow(id, cmd) {
  const el = document.createElement('div'); el.className = 'win w98-window';
  el.style.cssText = `left:${30 + n * 40}px;top:${30 + n * 34}px;width:640px;height:380px;z-index:${++z}`; n = (n + 1) % 8;
  el.innerHTML = `<div class="tt w98-titlebar"><input type="checkbox" title="include in Sangha prompt"><span>#${id} ${cmd}</span><button class="max w98-button">Fill</button><button class="x w98-button">Close</button></div><div class="body"></div>`;
  $('#desk').append(el);
  const term = new Terminal({ fontSize: 13, fontFamily: 'ui-monospace, Consolas, monospace', cursorBlink: true, theme: { background: '#07071a', foreground: '#f2efff', cursor: '#6fd3ff', selectionBackground: '#6fd3ff44', yellow: '#ffd84a', cyan: '#6fd3ff', magenta: '#b48cff', red: '#e0457b', green: '#2ea44f', blue: '#1c8fd6' } });
  const fit = new FitAddon.FitAddon(); term.loadAddon(fit); term.open(el.querySelector('.body'));
  const ws = new WebSocket(`ws://${location.host}/?id=${id}`);
  const resize = () => { try { fit.fit(); ws.readyState === 1 && ws.send(`\x00resize:${term.cols}x${term.rows}`); } catch {} };
  ws.onmessage = e => term.write(e.data); ws.onopen = resize; term.onData(d => ws.send(d));
  new ResizeObserver(resize).observe(el);
  const focus = () => { document.querySelectorAll('.win').forEach(w => w.classList.remove('focus')); el.classList.add('focus'); el.style.zIndex = ++z; };
  el.addEventListener('pointerdown', focus);
  const tt = el.querySelector('.tt');
  tt.addEventListener('pointerdown', e => { if (e.target.tagName !== 'SPAN' && e.target !== tt) return; if (innerWidth <= 760) return;
    const dx = e.clientX - el.offsetLeft, dy = e.clientY - el.offsetTop;
    const mv = m => { el.style.left = m.clientX - dx + 'px'; el.style.top = Math.max(0, m.clientY - dy) + 'px'; };
    addEventListener('pointermove', mv); addEventListener('pointerup', () => removeEventListener('pointermove', mv), { once: true }); });
  el.querySelector('.max').onclick = () => Object.assign(el.style, { left: '0', top: '0', width: innerWidth - 360 + 'px', height: innerHeight - 40 + 'px' });
  el.querySelector('.x').onclick = async () => { ws.close(); await api('/api/kill', { id }); el.remove(); delete wins[id]; };
  wins[id] = { el, term }; focus();
}
async function launch(cmd, role) { if (!cmd) return; const keep = $('#keep').checked; const { id } = await api('/api/spawn', { cmd, keep, role }); openWindow(id, (role === 'prompter' ? 'Prompter, ' : '') + (keep ? 'kept, ' : '') + cmd); }
document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => launch(b.dataset.cmd, b.dataset.role));
$('#panelBtn').onclick = () => $('#swarm').classList.toggle('open');
$('#launch').onclick = () => launch($('#custom').value.trim());
$('#msg').oninput = () => $('#send').disabled = $('#viaPrompter').disabled = !$('#msg').value.trim(); $('#send').disabled = $('#viaPrompter').disabled = true;

$('#viaPrompter').onclick = () => sendAll(true);
$('#send').onclick = () => sendAll(false);
async function sendAll(viaPrompter) {
  let shot = '';
  if ($('#shot').checked) { const c = await html2canvas(document.body, { backgroundColor: '#160a3f' }); shot = (await api('/api/shot', { png: c.toDataURL() })).file; }
  const ids = Object.entries(wins).filter(([, w]) => w.el.querySelector('input').checked).map(([i]) => i);
  const text = `(-: Sangha prompt (-: (: Network (: ${$('#net').value} :) (: Style (: ${$('#style').value} :) (: Roles (: ${$('#roles').value} :) (: Tools (: ${$('#tools').value} :) (: Sworn values (: ${$('#values').value} :) ${shot ? `(: Screenshot of the interface (: ${shot} :)` : ''} (: Instruction (: ${$('#msg').value} :) (: Acknowledge (: Begin your reply with {ACK} and your window number. :) :-) End Sangha prompt :-) thank you`;
  const r = await api(viaPrompter ? '/api/prompter' : '/api/swarm', { ids, text, values: $('#judge').checked ? $('#values').value : undefined, instruction: $('#msg').value });
  $('#status').textContent = r.error || (viaPrompter ? `sent to the Prompter, window ${r.sent[0]}` : `sent to windows ${r.sent.join(', ') || 'none'}`);
}
setInterval(async () => { $('#ledger').textContent = (await api('/api/ledger')).trim().split('\n').slice(-12).join('\n'); }, 3000);
api('/api/windows').then(ws => ws.filter(w => w.alive).forEach(w => openWindow(w.id, (w.role === 'prompter' ? 'Prompter, ' : '') + (w.keep ? 'kept, ' : '') + w.cmd)));
</script></body></html>
