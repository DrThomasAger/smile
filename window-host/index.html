<!doctype html>
<!-- (: SMILE (PROMPT SYSTEM) SYNTAX :) -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smile Window Host</title>
<link rel="stylesheet" href="/vendor/@xterm/xterm/css/xterm.css">
<style>
@font-face{font-family:"V1CT0R10U5";src:url(/assets/V1CT0R10U5-Regular.woff2) format("woff2");font-display:swap}
:root{--night:#0d0d21;--panel:#17172e;--line:#3a3560;--gold:#f2b824;--gold-deep:#9a6a0c;--parchment:#efe6cf;--dim:#b3aac8;--teal:#34c6d3;--ruby:#d6332a;
 --display:"V1CT0R10U5",Georgia,serif;--text:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;color:var(--parchment);font:14px/1.45 var(--text);
 background:linear-gradient(180deg,#0d0d21cc,#0d0d21f2),url(/assets/art-wildy.jpg) center/cover fixed,var(--night)}
button,input,select,textarea{font:inherit;color:var(--parchment);background:#0d0d21b3;border:1px solid var(--line);border-radius:8px;padding:6px 10px;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px #f2b82433}
button{cursor:pointer;background:linear-gradient(180deg,#22224a,#17172e)}
button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
button:disabled{opacity:.35;cursor:not-allowed}
#bar{position:fixed;bottom:0;left:0;right:0;height:52px;display:flex;gap:8px;align-items:center;padding:0 12px;z-index:9999;
 background:#17172ee6;backdrop-filter:blur(10px);border-top:1px solid var(--gold-deep)}
#bar .brand{display:flex;align-items:center;gap:8px;font:20px var(--display);color:var(--gold);margin-right:6px;letter-spacing:.04em;white-space:nowrap}
#bar .brand img{height:30px}
#bar [data-role=prompter]{border-color:var(--gold-deep);color:var(--gold)}
#bar label{display:flex;gap:4px;align-items:center;color:var(--dim);font-size:12px;white-space:nowrap}
#status{margin-left:auto;color:var(--teal);font-size:12px;white-space:nowrap}
.win{position:absolute;display:flex;flex-direction:column;min-width:320px;min-height:180px;resize:both;overflow:hidden;
 background:#07071a;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px #000a}
.win.focus{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-deep),0 18px 60px #000c,0 0 34px #f2b82422}
.tt{display:flex;gap:8px;align-items:center;padding:6px 10px;cursor:move;user-select:none;background:linear-gradient(180deg,#22224a,#17172e);border-bottom:1px solid var(--line)}
.tt span{flex:1;font:16px var(--display);color:var(--gold);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt button{padding:2px 10px;font-size:12px;border-radius:6px}
.tt .x:hover{border-color:var(--ruby)!important;color:var(--ruby)!important}
.tt input{accent-color:var(--gold)}
.body{flex:1;padding:6px;background:#07071a}
#swarm{position:absolute;right:14px;top:14px;bottom:66px;width:360px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:16px;z-index:9000;
 background:#17172ee6;backdrop-filter:blur(12px);border:1px solid var(--gold-deep);border-radius:14px;box-shadow:0 18px 50px #000a}
#swarm b{font:26px var(--display);color:var(--gold);font-weight:normal;letter-spacing:.04em;text-align:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
#swarm label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-top:4px}
#swarm label:has(input){text-transform:none;letter-spacing:0;display:flex;gap:6px;align-items:center;font-size:12px}
#swarm textarea{min-height:48px;resize:vertical}
#viaPrompter{background:linear-gradient(180deg,#f2b824,#9a6a0c);color:#0d0d21;border:none;font-weight:600;padding:10px}
#viaPrompter:hover:not(:disabled){color:#0d0d21;filter:brightness(1.1)}
#ledger{flex:1;min-height:90px;overflow:auto;font:11px/1.4 var(--mono);white-space:pre-wrap;color:var(--dim);background:#07071a;border:1px solid var(--line);border-radius:8px;padding:8px}
input[type=checkbox]{accent-color:var(--gold)}
#panelBtn{display:none}
@media (max-width:760px){
 #desk{position:absolute;inset:0 0 52px 0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
 .win{position:relative!important;left:0!important;top:0!important;width:100%!important;height:55vh!important;resize:none;flex:none}
 .tt button{padding:6px 12px}
 #swarm{position:fixed;left:0;right:0;top:auto;bottom:52px;width:auto;max-height:78vh;border-radius:16px 16px 0 0;display:none}
 #swarm.open{display:flex}
 #panelBtn{display:inline-block;border-color:var(--gold-deep);color:var(--gold)}
 #bar{overflow-x:auto;scrollbar-width:none} #bar>*{flex:none} #bar button{white-space:nowrap} #bar .brand span,#status{display:none} #panelBtn{order:-1}
 #custom{width:130px!important}
}
</style></head><body>
<div id="desk"></div>
<div id="swarm">
  <b>Prompt to Sangha</b>
  <label>Network communication structure</label>
  <select id="net"><option>star, every window reports to the Ganapati window</option><option>ring, each window passes to the next</option><option>mesh, every window may message every window</option><option>chain of command, user then Cosmic Spider then Ganapati then Ganas</option></select>
  <label>Writing style</label><textarea id="style">Precise, kind, no colons, no metaphors for technical processes, every prompt in Smile.</textarea>
  <label>Roles (window number = role)</label><textarea id="roles">1 = Ganapati, coordinates
2 = Gana, builder
3 = Gana, tester</textarea>
  <label>Tools available</label><textarea id="tools">shell, file edits, git, playwright</textarea>
  <label>Sworn values</label><textarea id="values">Benefit all beings. Follow the user first. Report every failure directly.</textarea>
  <label>Instruction</label><textarea id="msg" placeholder="What the Sangha does next"></textarea>
  <label><input type="checkbox" id="shot" checked> attach a screenshot of the interface each prompt</label>
  <button id="viaPrompter">Send to the Prompter, it prompts the ticked windows (all if none)</button>
  <button id="send">Send directly to selected windows (all if none ticked)</button>
  <div id="ledger"></div>
</div>
<div id="bar">
  <div class="brand"><img src="/assets/logo.png" alt=""><span>Smile</span></div>
  <button data-cmd="claude" data-role="prompter">+ Prompter (Claude Code)</button>
  <button data-cmd="claude">+ Claude Code</button>
  <button data-cmd="bash">+ Shell</button>
  <label style="font-size:11px"><input type="checkbox" id="keep"> restart when it ends</label>
  <input id="custom" placeholder="any command line program" style="width:260px">
  <button id="launch">Open as window</button>
  <button id="panelBtn">Sangha</button><span id="status" style="margin-left:auto;color:#999"></span>
</div>
<script src="/vendor/@xterm/xterm/lib/xterm.js"></script>
<script src="/vendor/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="/vendor/html2canvas/dist/html2canvas.min.js"></script>
<script>
const $ = s => document.querySelector(s), wins = {};
let z = 10, n = 0;
async function api(p, b) { const r = await fetch(p, b ? { method: 'POST', body: JSON.stringify(b) } : {}); return p === '/api/ledger' ? r.text() : r.json(); }

function openWindow(id, cmd) {
  const el = document.createElement('div'); el.className = 'win';
  el.style.cssText = `left:${30 + n * 40}px;top:${30 + n * 34}px;width:640px;height:380px;z-index:${++z}`; n = (n + 1) % 8;
  el.innerHTML = `<div class="tt"><input type="checkbox" title="include in Sangha prompt"><span>#${id} ${cmd}</span><button class="max">Fill</button><button class="x">Close</button></div><div class="body"></div>`;
  $('#desk').append(el);
  const term = new Terminal({ fontSize: 13, fontFamily: 'ui-monospace, Consolas, monospace', cursorBlink: true, theme: { background: '#07071a', foreground: '#efe6cf', cursor: '#f2b824', selectionBackground: '#f2b82444', yellow: '#f2b824', cyan: '#34c6d3', red: '#d6332a', blue: '#3f6fe0' } });
  const fit = new FitAddon.FitAddon(); term.loadAddon(fit); term.open(el.querySelector('.body'));
  const ws = new WebSocket(`ws://${location.host}/?id=${id}`);
  const resize = () => { try { fit.fit(); ws.readyState === 1 && ws.send(`\x00resize:${term.cols}x${term.rows}`); } catch {} };
  ws.onmessage = e => term.write(e.data); ws.onopen = resize; term.onData(d => ws.send(d));
  new ResizeObserver(resize).observe(el);
  const focus = () => { document.querySelectorAll('.win').forEach(w => w.classList.remove('focus')); el.classList.add('focus'); el.style.zIndex = ++z; };
  el.addEventListener('pointerdown', focus);
  const tt = el.querySelector('.tt');
  tt.addEventListener('pointerdown', e => { if (e.target.tagName !== 'SPAN' && e.target !== tt) return; if (innerWidth <= 760) return;
    const dx = e.clientX - el.offsetLeft, dy = e.clientY - el.offsetTop;
    const mv = m => { el.style.left = m.clientX - dx + 'px'; el.style.top = Math.max(0, m.clientY - dy) + 'px'; };
    addEventListener('pointermove', mv); addEventListener('pointerup', () => removeEventListener('pointermove', mv), { once: true }); });
  el.querySelector('.max').onclick = () => Object.assign(el.style, { left: '0', top: '0', width: innerWidth - 360 + 'px', height: innerHeight - 40 + 'px' });
  el.querySelector('.x').onclick = async () => { ws.close(); await api('/api/kill', { id }); el.remove(); delete wins[id]; };
  wins[id] = { el, term }; focus();
}
async function launch(cmd, role) { if (!cmd) return; const keep = $('#keep').checked; const { id } = await api('/api/spawn', { cmd, keep, role }); openWindow(id, (role === 'prompter' ? 'Prompter, ' : '') + (keep ? 'kept, ' : '') + cmd); }
document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => launch(b.dataset.cmd, b.dataset.role));
$('#panelBtn').onclick = () => $('#swarm').classList.toggle('open');
$('#launch').onclick = () => launch($('#custom').value.trim());
$('#msg').oninput = () => $('#send').disabled = $('#viaPrompter').disabled = !$('#msg').value.trim(); $('#send').disabled = $('#viaPrompter').disabled = true;

$('#viaPrompter').onclick = () => sendAll(true);
$('#send').onclick = () => sendAll(false);
async function sendAll(viaPrompter) {
  let shot = '';
  if ($('#shot').checked) { const c = await html2canvas(document.body, { backgroundColor: '#0d0d21' }); shot = (await api('/api/shot', { png: c.toDataURL() })).file; }
  const ids = Object.entries(wins).filter(([, w]) => w.el.querySelector('input').checked).map(([i]) => i);
  const text = `(-: Sangha prompt (-: (: Network (: ${$('#net').value} :) (: Style (: ${$('#style').value} :) (: Roles (: ${$('#roles').value} :) (: Tools (: ${$('#tools').value} :) (: Sworn values (: ${$('#values').value} :) ${shot ? `(: Screenshot of the interface (: ${shot} :)` : ''} (: Instruction (: ${$('#msg').value} :) (: Acknowledge (: Begin your reply with {ACK} and your window number. :) :-) End Sangha prompt :-) thank you`;
  const r = await api(viaPrompter ? '/api/prompter' : '/api/swarm', { ids, text });
  $('#status').textContent = r.error || (viaPrompter ? `sent to the Prompter, window ${r.sent[0]}` : `sent to windows ${r.sent.join(', ') || 'none'}`);
}
setInterval(async () => { $('#ledger').textContent = (await api('/api/ledger')).trim().split('\n').slice(-12).join('\n'); }, 3000);
api('/api/windows').then(ws => ws.filter(w => w.alive).forEach(w => openWindow(w.id, (w.role === 'prompter' ? 'Prompter, ' : '') + (w.keep ? 'kept, ' : '') + w.cmd)));
</script></body></html>
